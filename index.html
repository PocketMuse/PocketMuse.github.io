<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="PocketMuse — Android 기반 로컬 AI 프로토타입">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>PocketMuse | On-device AI</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111416;
      --text: #f1f4f3;
      --muted: #b0bbb7;
      --accent: #9edbc0;
      --border: #35413b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.75;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
    main { width: 100%; max-width: 36rem; border-bottom: 2px solid var(--border); padding-top: 2rem; }
    h1 { margin: 0 0 1rem; font-size: clamp(2.25rem, 8vw, 3.5rem); line-height: 1.2; letter-spacing: -0.04em; }
    .description { margin: 0; color: var(--muted); font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <h1>PocketMuse</h1>
    <p class="description">Android 기반 로컬 AI 프로토타입</p>
  </main>
</body>
</html>
