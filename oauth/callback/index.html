<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>앱에서 다시 시도해 주세요 | PocketMuse</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #111416;
      --surface: #1a1f22;
      --text: #f1f4f3;
      --muted: #b0bbb7;
      --accent: #9edbc0;
      --border: #35413b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.75;
      overflow-wrap: anywhere;
      word-break: keep-all;
    }
    main { width: 100%; max-width: 32rem; }
    h1 { margin: 0 0 1rem; font-size: clamp(1.75rem, 5vw, 2.25rem); line-height: 1.4; }
    p { margin: 0 0 1rem; }
    .instruction {
      margin: 1.5rem 0;
      padding: 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--surface);
    }
    .note { margin: 0; color: var(--muted); font-size: 0.875rem; }
  </style>
</head>
<body>
  <main>
    <h1>PocketMuse</h1>
    <p class="instruction">이 창을 닫고 PocketMuse 앱으로 돌아가 Civitai 로그인을 다시 시도해 주세요.</p>
    <p class="note">이 페이지에서는 로그인을 완료할 수 없습니다.</p>
  </main>
</body>
</html>
